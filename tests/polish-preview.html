<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Mission flow check</title><style>body{margin:16px;background:#0b1426;color:white;font:14px system-ui}nav{display:flex;gap:8px;margin-bottom:12px}button{padding:10px}iframe{display:block;width:390px;height:844px;border:1px solid #8ab5cb}output{display:block;margin:8px 0}</style></head><body><nav><button data-width="390">Phone · 390 px</button><button data-width="320" data-height="568">Phone · 320 × 568</button><button data-width="1024">Desktop · 1024 px</button><button id="finish">Finish current sol (test)</button><button id="report">Preview science report</button></nav><output id="status">Preview only</output><iframe title="Mission flow preview" src="../?debug"></iframe><script type="module">if(!import.meta.env.DEV)throw Error('Development only');const frame=document.querySelector('iframe');document.querySelectorAll('[data-width]').forEach(b=>b.onclick=()=>{frame.style.width=b.dataset.width+'px';frame.style.height=(b.dataset.height||844)+'px';});document.querySelector('#report').onclick=()=>frame.contentWindow.__game?.previewReport();document.querySelector('#finish').onclick=()=>{const g=frame.contentWindow.__game;if(!g)return;g.S.crisisDone=true;g.S.tasks.forEach(t=>t.done=true);g.S.science=Math.min(50,g.S.sol*10);g.emit('all');document.querySelector('#status').textContent=`Finished Sol ${g.S.sol} tasks for flow verification`;};</script></body></html>
